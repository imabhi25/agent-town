name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    # Cheap first line against committing a key or a database URL with a real password.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/secret_scan.py

  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_town
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_town
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_town"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Load schema
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=agent psql -v ON_ERROR_STOP=1 -h localhost -U agent -d agent_town -f "$f"
          done
      - run: ruff check .
      - run: pytest

  chaos:
    # Small chaos campaign with real crashes: worker and dispatcher processes killed with SIGKILL,
    # Redis killed and restarted. Fails if a correct run loses or duplicates anything, or if the
    # checker misses the deliberately broken worker (XACK before commit).
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_town
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_town
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_town"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Install redis-server (the campaign runs and kills its own)
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - name: Load schema
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=agent psql -v ON_ERROR_STOP=1 -h localhost -U agent -d agent_town -f "$f"
          done
      - name: Chaos campaign (3 correct runs, 2 broken runs)
        run: python scripts/chaos_campaign.py --reset --runs 3 --unsafe-runs 2 --jobs 150 --out ci-chaos.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results
          path: ci-chaos.jsonl

  spec:
    # TLA+ model of the engine (spec/): TLC must find no violation in the correct design and a
    # counterexample in every deliberately broken variant. Also checks the README block.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: tla2tools-1.8.0
      - name: Model-check every variant
        run: python scripts/check_spec.py --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlc-results
          path: results/spec/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke test (mock WebSocket)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
